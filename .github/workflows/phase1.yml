name: Manual Microkit boot smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase1:
    name: Microkit x86_64 + Zig + QEMU
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-system-x86

      - name: Install Zig 0.17.1
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://ziglang.org/download/0.17.1/zig-x86_64-linux-0.17.1.tar.xz \
            --output "$RUNNER_TEMP/zig.tar.xz"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.17.1" >> "$GITHUB_PATH"

      - name: Install seL4 Microkit SDK 2.4.0
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/seL4/microkit/releases/download/2.4.0/microkit-sdk-2.4.0-linux-x86-64.tar.gz \
            --output "$RUNNER_TEMP/microkit-sdk.tar.gz"
          mkdir -p "$RUNNER_TEMP/microkit-sdk"
          tar -xzf "$RUNNER_TEMP/microkit-sdk.tar.gz" -C "$RUNNER_TEMP/microkit-sdk"
          sdk_tool="$(find "$RUNNER_TEMP/microkit-sdk" -type f -path '*/bin/microkit' -print -quit)"
          test -n "$sdk_tool"
          sdk_root="${sdk_tool%/bin/microkit}"
          echo "MICROKIT_SDK=$sdk_root" >> "$GITHUB_ENV"

      - name: Validate toolchain and build the system image
        run: make check build

      - name: Boot QEMU and check the Zig banner
        run: make smoke-test
