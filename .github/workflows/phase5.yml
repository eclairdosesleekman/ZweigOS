name: Phase 5 ELF image staging

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase5:
    name: Zig tests + Microkit x86_64 + ELF image staging
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-system-x86

      - name: Install Zig 0.17.1
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://ziglang.org/download/0.17.1/zig-x86_64-linux-0.17.1.tar.xz \
            --output "$RUNNER_TEMP/zig.tar.xz"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.17.1" >> "$GITHUB_PATH"

      - name: Install seL4 Microkit SDK 2.4.0
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/seL4/microkit/releases/download/2.4.0/microkit-sdk-2.4.0-linux-x86-64.tar.gz \
            --output "$RUNNER_TEMP/microkit-sdk.tar.gz"
          mkdir -p "$RUNNER_TEMP/microkit-sdk"
          tar -xzf "$RUNNER_TEMP/microkit-sdk.tar.gz" -C "$RUNNER_TEMP/microkit-sdk"
          sdk_tool="$(find "$RUNNER_TEMP/microkit-sdk" -type f -path '*/bin/microkit' -print -quit)"
          test -n "$sdk_tool"
          sdk_root="${sdk_tool%/bin/microkit}"
          echo "MICROKIT_SDK=$sdk_root" >> "$GITHUB_ENV"

      - name: Show Zig formatter output for the new loader
        run: |
          zig fmt src/posix/image_loader.zig
          git diff -- src/posix/image_loader.zig

      - name: Run formatting, unit tests, and Microkit system build
        run: make check test build

      - name: Inspect generated Protection Domain entry points
        shell: bash
        run: |
          for image in build/zweig_init.elf build/zweig_memory.elf build/zweig_posix.elf; do
            echo "=== $image ==="
            readelf -h "$image" | grep -E 'Class:|Machine:|Entry point'
            nm -n "$image" | grep -E ' (_start|main|init|notified|zweig_memory_dispatch|zweig_posix_dispatch) || true
          done

      - name: Boot QEMU and verify existing POSIX bootstrap
        run: make smoke-test
